

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bilzy AI | Smart Marketplace</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#17243b}

header{background:#101c36;color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.logo{font-size:28px;font-weight:900;color:#58a6ff}

.logo span{color:#fff}

button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;font-weight:bold}

.sell{background:#317bff;color:white}

.hero{background:linear-gradient(125deg,#101c36,#164bb2);color:white;text-align:center;padding:65px 18px}

.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 15px}

.hero p{color:#dce7ff;font-size:17px}

.search{display:flex;max-width:650px;margin:28px auto 0;background:white;border-radius:12px;padding:6px}

.search input{flex:1;min-width:0;border:0;outline:0;padding:13px;font-size:16px}

.search button{background:#317bff;color:white}

.container{max-width:1200px;margin:auto;padding:35px 5%}

h2{margin:0 0 20px}

.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:20px}

.category{background:white;border:1px solid #dde3ed;white-space:nowrap;color:#17243b}

.category.active{background:#317bff;color:white}
