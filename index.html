

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bilzy AI | Smart Marketplace</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17233b}

header{background:#101c35;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

.logo{font-size:27px;font-weight:800;color:#69a9ff}

nav a{color:white;text-decoration:none;margin:0 10px}

button{cursor:pointer;border:0;border-radius:9px;padding:12px 18px;font-weight:bold}

.primary{background:#3478f6;color:white}

.hero{background:linear-gradient(125deg,#101c35,#245bb6);color:white;text-align:center;padding:65px 18px}

.hero h1{font-size:clamp(30px,5vw,52px);margin:0 0 15px}

.hero p{color:#dce8ff}

.search{display:flex;max-width:650px;margin:25px auto 0;background:white;border-radius:12px;padding:6px}

.search input{flex:1;min-width:0;border:0;outline:0;padding:13px;font-size:16px}

.container{max-width:1150px;margin:auto;padding:35px 18px}

h2{font-size:25px}

.categories{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}

.category{background:white;border:1px solid #dce4ef;color:#17233b}

.category.active{background:#3478f6;color:white}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
