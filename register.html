

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Become a Seller | Bilzy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #ddd;
    }
    h1 { color: #1769e0; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #1769e0;
      color: white;
      border: none;
      cursor: pointer;
    }
    a { color: #1769e0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bilzy Marketplace</h1>
    <h2>Become a Seller</h2>
    <p>Start selling on Bilzy today!</p>

    <form id="sellerForm">
      <input id="name" placeholder="Full Name" required>
      <input id="store" placeholder="Store Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <button type="submit">Register as Seller</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="index.html">Back to Marketplace</a></p>
  </div>

  <script>
    document.getElementById("sellerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Registration form works! Seller accounts are coming soon.";
    });
  </script>
</body>
</html>
